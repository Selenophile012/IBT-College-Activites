<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accessibility Fixes</title>
</head>

<body>

    <h1>Accessibility Improvements</h1>


    <!--
        FIX 1:
        A div was being used as a button.
        A real button is keyboard accessible and works with Enter and Space.
    -->

    <h2>Fix 1: Use a Real Button</h2>

    <button type="button">
        Submit
    </button>


    <!--
        FIX 2:
        The input was missing a label.
        The label tells screen readers what the field is for.
    -->

    <h2>Fix 2: Add a Label</h2>

    <label for="username">Username</label>

    <input
        id="username"
        name="username"
        type="text"
    >


    <!--
        FIX 3:
        The image was missing alt text.
        Meaningful alt text describes the image to screen-reader users.
    -->

    <h2>Fix 3: Add Alternative Text</h2>

    <img
        src="lalibela.jpg"
        alt="Rock-hewn church of Bete Giyorgis in Lalibela"
        width="640"
        height="420"
    >

</body>

</html>
