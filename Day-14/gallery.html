<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CSS Grid Gallery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 16px;
        }

        .gallery img {
            width: 100%;
            height: 220px;

            object-fit: cover;

            border-radius: 8px;
        }

    </style>
</head>

<body>

    <h1>Ethiopian Places Gallery</h1>

    <section class="gallery">

        <img
            src="https://images.unsplash.com/photo-1564596823821-5f7f1f9a9a3f?auto=format&fit=crop&w=600&q=80"
            alt="Ethiopian landscape"
        >

        <img
            src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=600&q=80"
            alt="African landscape"
        >

        <img
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
            alt="Mountain landscape"
        >

        <img
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
            alt="Natural scenery"
        >

    </section>

</body>

</html>
