<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Flexbox Navbar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 24px;

            background: #1B4D8E;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #D4A027;
            color: white;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Habesha
        </div>

        <div class="nav-links">

            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>

            <button class="nav-button">
                Sign In
            </button>

        </div>

    </nav>

</body>

</html>
