<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Market Shopping List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main>

        <h1>Addis Market Shopping List</h1>

        <form id="add-form">

            <input
                id="name"
                type="text"
                placeholder="Item name"
            >

            <input
                id="price"
                type="number"
                placeholder="Price in ETB"
            >

            <button type="submit">Add Item</button>

        </form>

        <p>
            Total: <span id="total">0.00</span> ETB
        </p>

        <ul id="list"></ul>

    </main>

    <script src="app.js"></script>

</body>
</html>
