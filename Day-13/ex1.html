<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CSS Variables Exercise</title>

    <style>

        :root {
            --brand: #1B4D8E;
            --accent: #D4A027;
            --space: 16px;
            --font-stack: Arial, Helvetica, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            padding: var(--space);
        }

        .btn {
            color: white;
            background: var(--brand);
            padding: var(--space);
            border: 2px solid var(--accent);
            font-family: var(--font-stack);
        }

    </style>
</head>

<body>

    <h1>CSS Variables</h1>

    <button class="btn">
        Click Me
    </button>

</body>

</html>
