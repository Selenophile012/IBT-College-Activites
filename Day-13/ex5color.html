<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CSS Color Systems</title>

    <style>

        .color-one {
            background: #1B4D8E;
            padding: 30px;
            margin: 10px;
            color: white;
        }

        .color-one:hover {
            background: hsl(212, 68%, 45%);
        }

        .color-two {
            background: #D4A027;
            padding: 30px;
            margin: 10px;
            color: white;
        }

        .color-two:hover {
            background: hsl(42, 67%, 55%);
        }

        .color-three {
            background: #2E8B57;
            padding: 30px;
            margin: 10px;
            color: white;
        }

        .color-three:hover {
            background: hsl(146, 50%, 45%);
        }

    </style>
</head>

<body>

    <h1>CSS Color Conversions</h1>

    <h2>Color 1</h2>

    <div class="color-one">
        Hex: #1B4D8E<br>
        RGB: rgb(27, 77, 142)<br>
        HSL: hsl(212, 68%, 33%)
    </div>

    <h2>Color 2</h2>

    <div class="color-two">
        Hex: #D4A027<br>
        RGB: rgb(212, 160, 39)<br>
        HSL: hsl(42, 69%, 49%)
    </div>

    <h2>Color 3</h2>

    <div class="color-three">
        Hex: #2E8B57<br>
        RGB: rgb(46, 139, 87)<br>
        HSL: hsl(146, 50%, 36%)
    </div>

</body>

</html>
